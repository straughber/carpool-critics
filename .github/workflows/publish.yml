name: Publish site

# GitHub Pages builds from main, so publishing is pushing. This workflow is the
# machine-independent backstop: it rebuilds the catalog/pages daily, which is
# what promotes a scheduled episode to indexable once YouTube makes it public.
#
# The production pipeline also publishes immediately after an upload (via
# tools/run_episode_pipeline.py --upload). The crons cover the release-time flip
# and any metadata drift edited directly in YouTube Studio. The second daily run
# exists because the first one is scheduled before the channel's publish hour:
# a build that starts earlier than the premiere can only ever see yesterday.

on:
  schedule:
    # 09:15 America/Chicago (CDT). GitHub cron is UTC. Morning backstop for
    # metadata drifted in Studio, and for the rare earlier premiere.
    - cron: "15 14 * * *"
    # 12:15 America/Chicago (CDT): just after the channel's 16:00Z premiere hour,
    # so a release-day flip reaches the site the same afternoon instead of the
    # next morning. Without this, a 16:00Z premiere waited ~17h for the flip.
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build, commit, push, verify
        env:
          # Optional. Without it the build reuses the committed data/movies.json.
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          # Read-only key for the channel. This is what lets the daily rebuild see
          # that a held episode has gone public and promote its page to indexable;
          # without it the build falls back to the RSS feed (~15 recent videos) and
          # quietly misses older metadata.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: ./scripts/publish.sh --auto
